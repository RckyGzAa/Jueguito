<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jueguito - Plataformas</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { background: #5c94fc; image-rendering: pixelated; max-width: 100vw; max-height: 80vh; border: 3px solid #333; }
  p { margin: 8px; font-size: 14px; opacity: .8; text-align: center; }
</style>
</head>
<body>
<canvas id="c" width="800" height="450"></canvas>
<p>← → / A D: mover · ESPACIO / ↑ / W: saltar · R: reiniciar</p>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const T = 32; // tamaño de tile
// Leyenda: # suelo, = plataforma, C moneda, E enemigo, S pinchos, F meta, P jugador
const LEVELS = [
[
"                                                            ",
"                                                            ",
"                                                            ",
"                                                            ",
"                                              C C           ",
"                                    C        =====          ",
"                      C C          ===                      ",
"             C       =====                          C       ",
"            ===                       E          =======  F ",
"   P                      E     ##########                ###",
"##########  ######  ####=======#          ##      S  S    ###",
"##########  ######  ####       #          ##  ##########  ###",
],
[
"                                                                  ",
"                                                                  ",
"                                         C                        ",
"                         C              ===                       ",
"            C           ===                        C C            ",
"           ===                   E                ======          ",
"                  C   E         ====                              ",
"                 ===  ==                     C                    ",
"                                  S S       ===             F     ",
"   P            E      ####  ###  ####  ##          E      #####  ",
"#######  S S  #######  ####  ###  ####  ##  ####  #########  ###  ",
"#######  ###  #######  ####  ###  ####  ##  ####  #########  ###  ",
],
];

let level, map, W, H, player, coins, enemies, score = 0, lives = 3, lvl = 0, state = 'play', cam = 0, msg = '', t = 0;
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyR') { lvl = 0; score = 0; lives = 3; load(0); }
  if (e.code === 'Enter' && state !== 'play') {
    if (state === 'dead') { lives = 3; score = 0; lvl = 0; }
    load(lvl);
  }
});
addEventListener('keyup', e => keys[e.code] = false);

function load(n) {
  lvl = n; level = LEVELS[n];
  H = level.length; W = level[0].length;
  map = []; coins = []; enemies = [];
  for (let y = 0; y < H; y++) { map[y] = [];
    for (let x = 0; x < W; x++) {
      const ch = level[y][x] || ' '; let tile = ch;
      if (ch === 'C') { coins.push({ x: x*T+8, y: y*T+8, w: 16, h: 16 }); tile = ' '; }
      if (ch === 'E') { enemies.push({ x: x*T, y: y*T, w: 28, h: 28, vx: -1, vy: 0, alive: true }); tile = ' '; }
      if (ch === 'P') { player = { x: x*T, y: y*T, w: 24, h: 30, vx: 0, vy: 0, ground: false, face: 1, coyote: 0, jbuf: 0 }; tile = ' '; }
      map[y][x] = tile;
    } }
  state = 'play'; cam = 0;
}

const solid = (x, y) => { const tx = Math.floor(x / T), ty = Math.floor(y / T);
  if (tx < 0 || tx >= W) return true; if (ty < 0 || ty >= H) return false;
  return map[ty][tx] === '#' || map[ty][tx] === '='; };
const hits = (o, ax, ay) => solid(ax, ay) || solid(ax + o.w - 1, ay) || solid(ax, ay + o.h - 1) || solid(ax + o.w - 1, ay + o.h - 1);

function move(o) { // movimiento con colisiones por eje
  let nx = o.x + o.vx;
  if (hits(o, nx, o.y)) { nx = o.vx > 0 ? Math.floor((nx + o.w) / T) * T - o.w : (Math.floor(nx / T) + 1) * T; o.vx = 0; o.hitWall = true; } else o.hitWall = false;
  o.x = nx;
  let ny = o.y + o.vy; o.ground = false;
  if (hits(o, o.x, ny)) {
    if (o.vy > 0) { ny = Math.floor((ny + o.h) / T) * T - o.h; o.ground = true; } else ny = (Math.floor(ny / T) + 1) * T;
    o.vy = 0;
  }
  o.y = ny;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function touchesFlag(p) { // meta: poste alto, 3 casillas de ancho
  for (let y = 0; y < H; y++) { const x = (level[y] || '').indexOf('F');
    if (x >= 0) return overlap(p, { x: (x - 1) * T, y: (y - 2) * T, w: 3 * T, h: 4 * T }); }
  return false;
}
function die() { lives--; if (lives <= 0) { state = 'dead'; msg = 'GAME OVER - Enter para reiniciar'; } else load(lvl); }

function update() {
  t++;
  if (state !== 'play') return;
  const p = player, L = keys.ArrowLeft || keys.KeyA, R = keys.ArrowRight || keys.KeyD;
  const jump = keys.Space || keys.ArrowUp || keys.KeyW;
  const acc = p.ground ? 0.6 : 0.4;
  if (L) { p.vx -= acc; p.face = -1; } if (R) { p.vx += acc; p.face = 1; }
  if (!L && !R) p.vx *= p.ground ? 0.75 : 0.95;
  p.vx = Math.max(-4.5, Math.min(4.5, p.vx));
  p.coyote = p.ground ? 6 : p.coyote - 1;
  p.jbuf = jump ? (p.jheld ? p.jbuf - 1 : 6) : 0; p.jheld = jump;
  if (p.jbuf > 0 && p.coyote > 0) { p.vy = -11.5; p.coyote = 0; p.jbuf = 0; }
  if (!jump && p.vy < -4) p.vy = -4; // salto variable
  p.vy = Math.min(p.vy + 0.55, 14);
  move(p);
  if (p.y > H * T + 100) die();
  const tx = Math.floor((p.x + p.w / 2) / T), ty = Math.floor((p.y + p.h - 2) / T);
  if (level[ty] && level[ty][tx] === 'S') { die(); return; }
  if (touchesFlag(p)) { if (lvl + 1 < LEVELS.length) { score += 100; load(lvl + 1); } else { state = 'win'; msg = '¡GANASTE! Puntos: ' + score + ' - Enter para jugar de nuevo'; lvl = 0; } return; }
  for (const c of coins) if (!c.got && overlap(p, c)) { c.got = true; score += 10; }
  for (const e of enemies) {
    if (!e.alive) continue;
    e.vy = Math.min(e.vy + 0.55, 14);
    const dir = e.vx; e.vx = e.vx || dir; move(e);
    const ahead = e.x + (dir > 0 ? e.w + 1 : -1), foot = e.y + e.h + 2;
    if (e.hitWall || (e.ground && !solid(ahead, foot))) e.dir = -(e.dir || dir);
    e.vx = (e.dir || dir) * 1;
    if (overlap(p, e)) {
      if (p.vy > 0 && p.y + p.h - e.y < 16) { e.alive = false; p.vy = -8; score += 50; } else { die(); return; }
    }
  }
  cam = Math.max(0, Math.min(W * T - cv.width, p.x + p.w / 2 - cv.width / 2));
}

function draw() {
  ctx.fillStyle = '#5c94fc'; ctx.fillRect(0, 0, cv.width, cv.height);
  // nubes parallax
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  for (let i = 0; i < 8; i++) { const x = ((i * 260 - cam * 0.3) % (cv.width + 200) + cv.width + 200) % (cv.width + 200) - 100;
    ctx.beginPath(); ctx.arc(x, 70 + (i % 3) * 40, 22, 0, 7); ctx.arc(x + 26, 62 + (i % 3) * 40, 28, 0, 7); ctx.arc(x + 54, 72 + (i % 3) * 40, 20, 0, 7); ctx.fill(); }
  ctx.save(); ctx.translate(-Math.round(cam), 0);
  const y0 = cv.height - H * T; ctx.translate(0, y0);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = level[y][x], px = x * T, py = y * T;
    if (c === '#') { ctx.fillStyle = '#8b5a2b'; ctx.fillRect(px, py, T, T); ctx.fillStyle = '#3cb043'; if (!solid(px, py - 1)) ctx.fillRect(px, py, T, 8); ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.strokeRect(px + .5, py + .5, T - 1, T - 1); }
    else if (c === '=') { ctx.fillStyle = '#c98b4a'; ctx.fillRect(px, py, T, T / 2); ctx.fillStyle = '#7a4a1a'; ctx.fillRect(px, py + T / 2 - 4, T, 4); }
    else if (c === 'S') { ctx.fillStyle = '#ddd'; for (let i = 0; i < 2; i++) { ctx.beginPath(); ctx.moveTo(px + i * 16, py + T); ctx.lineTo(px + i * 16 + 8, py + 10); ctx.lineTo(px + i * 16 + 16, py + T); ctx.fill(); } }
    else if (c === 'F') { ctx.fillStyle = '#fff'; ctx.fillRect(px + 14, py - T * 2, 4, T * 3); ctx.fillStyle = '#e22'; ctx.beginPath(); ctx.moveTo(px + 18, py - T * 2); ctx.lineTo(px + 44, py - T * 2 + 12); ctx.lineTo(px + 18, py - T * 2 + 24); ctx.fill(); }
  }
  for (const c of coins) if (!c.got) { const w = Math.abs(Math.cos(t / 12)) * 8 + 2; ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.ellipse(c.x + 8, c.y + 8, w, 8, 0, 0, 7); ctx.fill(); }
  for (const e of enemies) if (e.alive) { ctx.fillStyle = '#a33'; ctx.fillRect(e.x, e.y + 6, e.w, e.h - 6); ctx.fillStyle = '#fff'; ctx.fillRect(e.x + 5, e.y + 11, 6, 6); ctx.fillRect(e.x + 17, e.y + 11, 6, 6); ctx.fillStyle = '#000'; ctx.fillRect(e.x + 7, e.y + 13, 3, 3); ctx.fillRect(e.x + 19, e.y + 13, 3, 3); }
  if (player) { const p = player; ctx.fillStyle = '#e33'; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.fillStyle = '#fc9'; ctx.fillRect(p.x + 3, p.y + 4, p.w - 6, 10);
    ctx.fillStyle = '#000'; ctx.fillRect(p.x + (p.face > 0 ? 14 : 6), p.y + 7, 4, 4);
    ctx.fillStyle = '#a00'; ctx.fillRect(p.x - 1, p.y - 3, p.w + 2, 6); }
  ctx.restore();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'left';
  ctx.fillText(`Puntos: ${score}   Vidas: ${'♥'.repeat(Math.max(lives, 0))}   Nivel ${lvl + 1}/${LEVELS.length}`, 12, 24);
  if (state !== 'play') { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 170, cv.width, 90); ctx.fillStyle = '#fff'; ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center'; ctx.fillText(msg, cv.width / 2, 224); }
}

load(0);
(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
